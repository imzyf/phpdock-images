name: lint

# 脚本是在改动时才会坏的，所以挂在 push/PR 上，而不是塞进 sync 那条流水线
# ——那里跑的永远是上一次就已经 lint 过的同一份脚本。
on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
      -
        # ubuntu-latest 预装了 shellcheck，不需要额外安装。
        name: Run shellcheck
        run: make lint
