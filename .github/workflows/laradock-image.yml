name: laradock-image

on:
  workflow_dispatch: {}
  # 开放调用，让 sync-upstream 能验证自己开的 PR 分支。
  workflow_call:
    inputs:
      ref:
        description: Git ref to build. Empty means the default checkout.
        type: string
        default: ""

permissions:
  contents: read

env:
  REGISTRY_IMAGE: yifans/phpdock

jobs:
  build:
    # arm64 跑在 GitHub 免费的原生 arm runner 上，不再用 QEMU 模拟（快 5-10 倍）。
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    env:
      # 只有主仓库自己的手动运行才推送镜像；workflow_call 验证只构建、不发布。
      PUBLISH: ${{ github.repository == 'imzyf/phpdock-images' && inputs.ref == '' }}
      PLATFORM_PAIR: ${{ matrix.platform == 'linux/arm64' && 'arm64' || 'amd64' }}
    strategy:
      matrix:
        php_version: ["8.5"]
        image: [php-fpm, php-worker, workspace]
        # 发布时两个架构各自在原生机器上并行构建；验证运行只需要 amd64。
        platform: ${{ fromJSON((github.repository == 'imzyf/phpdock-images' && inputs.ref == '') && '["linux/amd64","linux/arm64"]' || '["linux/amd64"]') }}
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      -
        # bin/build-args.sh 把 .env.laradock 与 .env.laradock.preference 合并成
        # 去重的 NAME=value 行（preference 胜出），与 make 消费的是同一份输出。
        name: Merge build args from .env.laradock + .env.laradock.preference
        id: build-args
        run: |
          {
            echo 'args<<EOF'
            bin/build-args.sh
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Login to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        # 单架构镜像先按 digest 推送（不占用 tag），由 merge job 合成多架构 manifest。
        name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image }}
          file: ${{ matrix.image }}/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: ${{ env.PUBLISH == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.REGISTRY_IMAGE) || 'type=cacheonly' }}
          build-args: |
            ${{ steps.build-args.outputs.args }}
            LARADOCK_PHP_VERSION=${{ matrix.php_version }}
      -
        # 用空文件的文件名传 digest，merge job 直接 glob 出来拼命令。
        name: Export digest
        if: env.PUBLISH == 'true'
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      -
        name: Upload digest
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.php_version }}-${{ matrix.image }}-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    # 验证运行不推送任何 digest，没有可合并的东西。
    if: github.repository == 'imzyf/phpdock-images' && inputs.ref == ''
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php_version: ["8.5"]
        image: [php-fpm, php-worker, workspace]
    steps:
      -
        name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.php_version }}-${{ matrix.image }}-*
          merge-multiple: true
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        # 两个 tag 指向同一份 manifest：带年月的是不可变快照，不带的滚动指向最新一版。
        name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          base="${REGISTRY_IMAGE}:${{ matrix.php_version }}-${{ matrix.image }}"
          dated="${base}-$(date -u +%Y%m)"
          mapfile -t refs < <(printf "${REGISTRY_IMAGE}@sha256:%s\n" *)
          docker buildx imagetools create -t "$dated" -t "$base" "${refs[@]}"
          docker buildx imagetools inspect "$base"
