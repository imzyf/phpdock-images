name: laradock-image

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 0 * * 0"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php_version: ["8.5"]
        image: [php-fpm, php-worker, workspace]
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        # bin/build-args.sh merges .env.laradock + .env.laradock.preference into
        # deduped NAME=value lines (preference wins); same output make consumes.
        name: Merge build args from .env.laradock + .env.laradock.preference
        id: build-args
        run: |
          {
            echo 'args<<EOF'
            bin/build-args.sh
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      -
        name: Compute tag
        id: tags
        run: |
          echo "tag=yifans/phpdock:${{ matrix.php_version }}-${{ matrix.image }}" >> "$GITHUB_OUTPUT"
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Build and push Docker images
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image }}
          file: ${{ matrix.image }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.repository == 'imzyf/phpdock-images' }}
          tags: ${{ steps.tags.outputs.tag }}
          build-args: |
            ${{ steps.build-args.outputs.args }}
            LARADOCK_PHP_VERSION=${{ matrix.php_version }}
