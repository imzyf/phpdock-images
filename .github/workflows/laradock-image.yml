name: laradock-image

on:
  workflow_dispatch: {}
  # 开放调用，让 sync-upstream 能验证自己开的 PR 分支。
  workflow_call:
    inputs:
      ref:
        description: Git ref to build. Empty means the default checkout.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 只有主仓库自己的手动运行才推送镜像；workflow_call 验证只构建、不发布。
      PUBLISH: ${{ github.repository == 'imzyf/phpdock-images' && inputs.ref == '' }}
    strategy:
      matrix:
        php_version: ["8.5"]
        image: [php-fpm, php-worker, workspace]
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      -
        # bin/build-args.sh 把 .env.laradock 与 .env.laradock.preference 合并成
        # 去重的 NAME=value 行（preference 胜出），与 make 消费的是同一份输出。
        name: Merge build args from .env.laradock + .env.laradock.preference
        id: build-args
        run: |
          {
            echo 'args<<EOF'
            bin/build-args.sh
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      -
        name: Compute tag
        id: tags
        run: |
          echo "tag=yifans/phpdock:${{ matrix.php_version }}-${{ matrix.image }}" >> "$GITHUB_OUTPUT"
      -
        # 只有 arm64 那一路需要它，而验证运行不构建 arm64。
        name: Set up QEMU
        if: env.PUBLISH == 'true'
        uses: docker/setup-qemu-action@v3
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Login to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Build and push Docker images
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image }}
          file: ${{ matrix.image }}/Dockerfile
          platforms: ${{ env.PUBLISH == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.tags.outputs.tag }}
          build-args: |
            ${{ steps.build-args.outputs.args }}
            LARADOCK_PHP_VERSION=${{ matrix.php_version }}
