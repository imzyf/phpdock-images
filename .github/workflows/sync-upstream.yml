name: sync-upstream

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      -
        # 默认浅克隆（fetch-depth: 1）就够：make sync 只读工作区文件，
        # create-pull-request 也只从当前 HEAD 开新分支。
        name: Checkout
        uses: actions/checkout@v7
      -
        # CI 每次都是干净 runner，克隆缓存必然是冷的，用 sync-force 把这点写明。
        # 同步完顺手记下上游 commit，供 PR 正文追溯版本。
        name: Sync files from laradock/laradock
        id: sync
        run: |
          make sync-force
          echo "upstream-commit=$(git -C bin/.cache/upstream rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      -
        # 只有 make sync 产生 diff 时才开（或更新）PR，否则什么都不做。
        # 用的是默认 GITHUB_TOKEN，所以这个 PR 不产生任何事件。
        name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: |
            Sync files from laradock/laradock upstream

            Upstream commit: ${{ steps.sync.outputs.upstream-commit }}
          branch: sync/laradock-upstream
          delete-branch: true
          title: "Sync files from laradock/laradock upstream"
          body: |
            Automated `make sync` picked up changes from
            [laradock/laradock](https://github.com/laradock/laradock) upstream.

            Synced up to [`${{ steps.sync.outputs.upstream-commit }}`](https://github.com/laradock/laradock/commit/${{ steps.sync.outputs.upstream-commit }}).

            Review the diff before merging. Merging does not publish: run
            `laradock-image` by hand to build and push the new tags.
